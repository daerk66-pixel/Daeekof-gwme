<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Неоновый Уклонист</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#05060f; overflow:hidden; touch-action:none;
    font-family:-apple-system,Roboto,Arial,sans-serif; color:#eaf6ff; user-select:none; }
  #game { display:block; width:100%; height:100%; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; background:rgba(3,5,15,.82); backdrop-filter:blur(6px); text-align:center; padding:24px; }
  .hidden { display:none; }
  h1 { font-size:clamp(28px,9vw,56px); letter-spacing:2px;
    background:linear-gradient(90deg,#4df3ff,#a06bff,#ff5fa2);-webkit-background-clip:text;background-clip:text;color:transparent; }
  p { opacity:.8; font-size:clamp(13px,4vw,18px); line-height:1.5; max-width:460px; }
  button { pointer-events:auto; border:none; border-radius:999px; padding:14px 38px; font-size:18px; font-weight:700;
    color:#06121a; background:linear-gradient(90deg,#4df3ff,#7ce7b0); box-shadow:0 0 24px rgba(77,243,255,.5); }
  .big { font-size:clamp(20px,6vw,32px); font-weight:700; color:#ffd166; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="overlay" id="startScreen">
  <h1>НЕОНОВЫЙ УКЛОНИСТ</h1>
  <p>Веди корабль пальцем. Уклоняйся от красных астероидов, собирай синие ядра энергии.
     Каждые 10 очков скорость растёт. Три жизни — используй их с умом!</p>
  <button id="startBtn">ИГРАТЬ</button>
</div>

<div class="overlay hidden" id="overScreen">
  <h1>ИГРА ОКОНЧЕНА</h1>
  <div class="big" id="finalScore">Очки: 0</div>
  <div class="big" id="bestScore">Рекорд: 0</div>
  <button id="againBtn">ЕЩЁ РАЗ</button>
</div>

<script src="game.js"></script>
</body>
</html>

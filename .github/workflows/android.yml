name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
          set +e
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt
          echo "exit=${PIPESTATUS[0]}" | tee -a build-log.txt
          grep -iE "FAILURE:|error:|Could not|What went wrong" -A4 build-log.txt | head -40 | while read -r l; do echo "::error::$l"; done
          exit 0

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: neon-dodger-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
